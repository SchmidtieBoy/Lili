<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentinstag-Einladung</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
  <link rel="stylesheet" href="Main.css">
  <script src="Main.js" defer></script>
</head>
<body>
  <div class="container">
    <h1 class="header">Möchtest du mein Valentinsdate sein?</h1>
    <div class="buttons-container">
      <!-- Der erste "Ja"-Button bekommt über CSS seine Startposition -->
      <button class="btn ja-btn">Ja</button>
      <button class="btn nein-btn">Nein</button>
    </div>
  </div>
  <div class="overlay">
    <div class="overlay-content">
      <h2>Ich freu mich riesig! :heart:</h2>
      <p>Unser Valentinsdate am 14. Februar:</p>
      <p>19:00 Uhr - Romantisches Dinner bei Kerzenschein</p>
      <p>Dann ein Spaziergang unter dem Sternenhimmel</p>
      <p>Ich hol dich ab ♥</p>
    </div>
  </div>
</body>
</html>
