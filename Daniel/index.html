<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Valentinstag-Einladung</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
    <link rel="stylesheet" href="Main.css">
    <script src="Main.js"></script>
</head>

<body>
    <div class="mainPage">
        <div class="startBox">
            <h1 class="header">Möchtest du mein Valentinsdate sein?</h1>

            <div class="startButtons">
                <button class="button ja">Ja</button>
                <button class="button fake">Nein</button>
            </div>
        </div>

        <div class="buttons-container">
            <button class="button nein">Nein</button>
        </div>
    </div>

    <div class="overlayPage">
        <div class="overlayContent">
            <h2>Ich freu mich riesig! ❤️</h2>
            <p>Unser Valentinsdate am 14. Februar:</p>
            <p>19:00 Uhr - Romantisches Dinner bei Kerzenschein</p>
            <p>Dann ein Spaziergang unter dem Sternenhimmel</p>
            <p>Ich hol dich ab ♥</p>
        </div>
    </div>
</body>

</html>
